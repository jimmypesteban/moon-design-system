<!-- The brand mark as the favicon. Storybook ships its own (a pink #FF4785
     Storybook logo), so without this the browser tab advertises Storybook
     rather than Moon — the single most visible unbranded surface here. The
     guidelines are explicit that the mark is what stands in when the wordmark
     cannot be used, "for example as a favicon, app icon" (2.2 Brand Mark).
     Served under its own name rather than favicon.svg: Storybook ships a
     favicon.svg of its own and wins that collision, so the staticDir copy
     never reached the browser. A distinct filename sidesteps the fight. -->
<link rel="icon" type="image/svg+xml" href="./moon-favicon.svg" />

<!-- The tab reads "… ⋅ Storybook" by default, which is the same problem as the
     favicon one layer up: the tool's name where the brand's belongs. Storybook
     v10 exposes no documented title API, so this rewrites the suffix instead.
     Deliberately narrow: it only swaps the trailing "⋅ Storybook" and leaves
     the story path alone, so if a future version changes the format the title
     is simply left as Storybook wrote it rather than mangled. Watched with a
     MutationObserver because Storybook resets the title on every navigation. -->
<script>
  (function () {
    var SUFFIX = / ⋅ Storybook$/;
    var BRAND = ' ⋅ Moon Design System';
    function brandTitle() {
      if (SUFFIX.test(document.title)) {
        document.title = document.title.replace(SUFFIX, BRAND);
      }
    }
    brandTitle();
    var titleEl = document.querySelector('title');
    if (titleEl) {
      new MutationObserver(brandTitle).observe(titleEl, { childList: true });
    }
    // Storybook can replace the <title> element itself, not just its text.
    new MutationObserver(function () {
      var next = document.querySelector('title');
      if (next && next !== titleEl) {
        titleEl = next;
        new MutationObserver(brandTitle).observe(titleEl, { childList: true });
        brandTitle();
      }
    }).observe(document.head, { childList: true });
  })();
</script>

<!-- The same rasteriser the Logo and Shapes pages use, bundled to a global by
     `npm run build:chat-download` (prestorybook/prebuild-storybook). The manager
     document is outside Vite's module graph and cannot import the TypeScript
     directly, and a second hand-rolled copy of "SVG to PNG at a given size" is
     exactly the duplication this design system spends its time removing. If the
     bundle is missing the chat degrades to a plain link at the file's own size,
     which is what it did before custom sizes existed. -->
<script src="./mo-svg-download.js"></script>

<script>
  (function () {
    // Storybook's manager document is loaded once per session, so this
    // runs exactly once — no need to guard against re-injection.
    // The assistant needs its backend; static deploys run without one, and
    // the chat says so instead of failing a fetch against nothing.
    var ENDPOINT = /localhost|127\.0\.0\.1/.test(window.location.hostname)
      ? 'http://localhost:3000/api/storybook-assistant/chat'
      : null;
    var MAX_HISTORY = 12;

    // A real download glyph (tray + arrow), not a plain "↓"/"⬇" character —
    // inline SVG since this plain script has no icon library available.
    var DOWNLOAD_ICON =
      '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" class="mo-help-chat-download-icon" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>';

    var history = [];
    var launcher = document.getElementById('mo-help-chat-launcher');
    var panel = document.getElementById('mo-help-chat-panel');
    var closeBtn = document.getElementById('mo-help-chat-close');
    var messagesEl = document.getElementById('mo-help-chat-messages');
    var form = document.getElementById('mo-help-chat-form');
    var input = document.getElementById('mo-help-chat-input');
    var sendBtn = document.getElementById('mo-help-chat-send');

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Only a link the assistant is allowed to point at (see
    // STORYBOOK_PAGE_IDS in the dashboard's context.ts) renders as a real
    // link — anything else collapses back to plain text. This is the
    // actual security boundary against a malicious/hallucinated href, not
    // just a nicety.
    function isSafeDocHref(href) {
      return /^\/\?path=\/docs\/[a-z0-9-]+--docs$/.test(href) || /^https:\/\/[^\s"'<>]+$/.test(href);
    }

    // A real, immediately-downloadable brand asset — served unhashed from
    // .storybook/main.ts's staticDirs (../assets -> /brand-assets), the
    // same source Logo.stories.tsx's own download buttons use. Narrowed to
    // exactly the moon-logo/moon-mark filenames (every brand color, SVG
    // + PNG) rather than "anything under /brand-assets/" — the assets
    // folder also holds icon sets that were never meant to be chat-served.
    var ASSET_FILE = /^\/brand-assets\/moon-(logo|mark)(-(white|black|yellow|orange|pink|purple|green|forest|blue|ocean))?\.(svg|png)$/;
    // The twenty page-36 shapes. They ship filled brand red; a `fill=mo-*`
    // parameter recolours on the way out, validated against the palette the
    // rasteriser bundle exports — never against colours retyped here.
    var SHAPE_FILE = /^\/brand-assets\/shapes\/vector([1-9]|1[0-9]|20)\.(svg|png)$/;

    function isSafeAssetHref(href) {
      var file = href.split('?')[0];
      if (ASSET_FILE.test(file)) return parseSize(href) !== null;
      if (SHAPE_FILE.test(file)) return parseSize(href) !== null;
      return false;
    }

    // An asset link may carry exactly one size: `?scale=4` or `?w=512`.
    // Returns null for anything else, which makes the whole href unsafe rather
    // than silently dropping the part that was not understood — the assistant
    // writes these, and a malformed one should look wrong, not work partially.
    //
    // Bounds are deliberate. Scale is capped at 16 and width at 4096 because
    // the PNG path rasterises on a canvas in the visitor's browser: the mark is
    // 300px square, so 16x is a 4800px image, and past that a helpful request
    // turns into a frozen tab.
    function parseSize(href) {
      var q = href.indexOf('?');
      if (q === -1) return { format: null, scale: null, width: null, fill: null };
      var out = { format: null, scale: null, width: null, fill: null };
      var parts = href.slice(q + 1).split('&');
      if (parts.length > 2) return null;
      for (var i = 0; i < parts.length; i += 1) {
        var scale = /^scale=(\d{1,2}(?:\.5)?)$/.exec(parts[i]);
        if (scale) {
          if (out.scale !== null || out.width !== null) return null;
          var s = parseFloat(scale[1]);
          if (!(s > 0 && s <= 16)) return null;
          out.scale = s;
          continue;
        }
        var width = /^w=(\d{2,4})$/.exec(parts[i]);
        if (width) {
          if (out.scale !== null || out.width !== null) return null;
          var w = parseInt(width[1], 10);
          if (!(w >= 16 && w <= 4096)) return null;
          out.width = w;
          continue;
        }
        // A fill must name a token the rasteriser bundle vouches for. When the
        // bundle is absent the fill cannot be honoured, so the link is unsafe
        // rather than silently the wrong colour.
        var fill = /^fill=(mo-[a-z]+)$/.exec(parts[i]);
        if (fill) {
          if (out.fill !== null) return null;
          var fills = (window.MoSvgDownload || {}).BRAND_FILLS || {};
          if (!fills[fill[1]]) return null;
          out.fill = fill[1];
          continue;
        }
        return null;
      }
      return out;
    }

    // Minimal, deliberately narrow markdown renderer for assistant replies:
    // fenced code blocks, inline code, **bold**, and [text](url) links.
    // Everything is HTML-escaped first, so this can only ever add the four
    // tags below — it can't be used to inject arbitrary markup.
    // Sized downloads pending a click, keyed by the token embedded in the link.
    // Kept out of the markup so no size or filename is ever parsed back out of
    // the DOM — the values the generator uses are the ones parseSize validated.
    var generatedDownloads = [];

    function renderMarkdown(raw) {
      var html = escapeHtml(raw);
      var codeBlocks = [];
      // One preview per distinct asset (SVG + PNG of the same logo share a
      // base name) — a second link to the same file gets a download button
      // without repeating the thumbnail right above it.
      var previewedAssets = {};
      html = html.replace(/```[a-zA-Z0-9]*\n?([\s\S]*?)```/g, function (_m, code) {
        codeBlocks.push(code);
        return '␀CODEBLOCK' + (codeBlocks.length - 1) + '␀';
      });
      html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
      // "* " / "- " list markers at the start of a line -> a bullet
      // character, not a real <ul> (this renderer works line-by-line on
      // <br>-joined text, not a block parser). Must run before **bold**/
      // *italic* below, or the leading "*" is mistaken for an italic
      // delimiter and eats the rest of the line.
      html = html.replace(/^[*-] /gm, '• ');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_m, text, href) {
        // escapeHtml has already run, so a two-parameter href arrives with
        // `&amp;` where the assistant wrote `&`. Validate the decoded form;
        // keep writing the escaped one into attributes, where &amp; is the
        // correct spelling anyway. Without this, exactly the links with both
        // a size and a fill — the ones this feature exists for — were the
        // ones rejected.
        var decoded = href.replace(/&amp;/g, '&');
        if (isSafeAssetHref(decoded)) {
          var file = decoded.split('?')[0];
          var size = parseSize(decoded);
          var assetKey = file.replace(/\.(svg|png)$/, '');
          var preview = '';
          if (!previewedAssets[assetKey]) {
            previewedAssets[assetKey] = true;
            preview =
              '<div class="mo-help-chat-asset-preview"><img src="' +
              file +
              '" alt="' +
              text +
              '" class="mo-help-chat-asset-thumb"></div>';
          }

          // Nothing to change, or no rasteriser on the page: hand over the
          // committed file exactly as before. The browser's own download is
          // always better than a generated one when nothing has to change.
          var wantsWork = size && (size.scale !== null || size.width !== null || size.fill !== null);
          if (!wantsWork || !window.MoSvgDownload || !window.MoSvgDownload.downloadAtSize) {
            return preview + '<a href="' + file + '" download class="mo-help-chat-download">' + DOWNLOAD_ICON + text + '</a>';
          }

          // Generated on click, from the SVG, at the size and colour asked
          // for. The href stays on the element so middle-click and "copy
          // link" still reach a real file rather than dying on a `#`.
          var token = 'gen' + (generatedDownloads.length);
          generatedDownloads.push({
            file: file,
            format: /\.png$/.test(file) ? 'png' : 'svg',
            scale: size.scale,
            width: size.width,
            fill: size.fill
          });
          return preview +
            '<a href="' + file + '" data-mo-generate="' + token + '" class="mo-help-chat-download">' +
            DOWNLOAD_ICON + text + '</a>';
        }
        return isSafeDocHref(href) ? '<a href="' + href + '" target="_blank" rel="noopener">' + text + '</a>' : text;
      });
      html = html.replace(/\n/g, '<br>');
      html = html.replace(/␀CODEBLOCK(\d+)␀/g, function (_m, idx) {
        return '<pre><code>' + codeBlocks[Number(idx)] + '</code></pre>';
      });
      return html;
    }

    function addBubble(role, text, format) {
      var bubble = document.createElement('div');
      bubble.className = 'mo-help-chat-bubble ' + role;
      if (format === 'markdown') {
        bubble.innerHTML = renderMarkdown(text);
      } else {
        bubble.textContent = text;
      }
      messagesEl.appendChild(bubble);
      scrollToBottom();
      return bubble;
    }

    // One delegated listener rather than one per rendered link: bubbles are
    // re-rendered on every reply, and per-element handlers would leak with them.
    messagesEl.addEventListener('click', function (event) {
      var link = event.target && event.target.closest
        ? event.target.closest('a[data-mo-generate]')
        : null;
      if (!link) return;

      var job = generatedDownloads[Number(link.getAttribute('data-mo-generate').slice(3))];
      if (!job) return;

      event.preventDefault();
      if (link.dataset.moBusy === '1') return;
      link.dataset.moBusy = '1';
      var label = link.textContent;
      link.textContent = 'Preparing…';

      window.MoSvgDownload.downloadAtSize(
        // Always rasterise from the vector, even when the person asked for a
        // PNG: scaling up the committed PNG would hand them a blurry file that
        // looks like the design system's fault.
        job.file.replace(/\.png$/, '.svg'),
        job.file.split('/').pop().replace(/\.(svg|png)$/, ''),
        {
          format: job.format,
          scale: job.scale || undefined,
          width: job.width || undefined,
          // Token to hex at click time, from the bundle's own palette.
          fill: job.fill ? window.MoSvgDownload.BRAND_FILLS[job.fill] : undefined
        }
      )
        .catch(function () {
          // Say so rather than leaving "Preparing…" forever. The committed file
          // is still one click away at its own size.
          addBubble(
            'assistant',
            'That size could not be generated in this browser. The file at its own size is still above.',
            'text'
          );
        })
        .finally(function () {
          link.dataset.moBusy = '';
          link.textContent = label;
        });
    });

    launcher.addEventListener('click', function () {
      panel.classList.add('open');
      input.focus();
    });
    closeBtn.addEventListener('click', function () {
      panel.classList.remove('open');
    });

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      var text = input.value.trim();
      if (!text) return;

      if (!ENDPOINT) {
        addBubble('user', text);
        input.value = '';
        addBubble(
          'assistant',
          'This public build runs without the assistant backend, so I cannot answer live here. Everything I would quote — every color, size, and component — is on the Foundations and Components pages in the sidebar.'
        );
        scrollToBottom();
        return;
      }

      addBubble('user', text);
      history.push({ role: 'user', content: text });
      if (history.length > MAX_HISTORY) {
        history = history.slice(history.length - MAX_HISTORY);
      }

      input.value = '';
      input.disabled = true;
      sendBtn.disabled = true;
      var thinkingBubble = addBubble('assistant', 'Thinking…');

      fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      })
        .then(function (res) {
          return res.json().then(function (data) {
            if (!res.ok) {
              throw new Error(data && data.error ? data.error : 'Request failed');
            }
            return data;
          });
        })
        .then(function (data) {
          thinkingBubble.innerHTML = renderMarkdown(data.reply);
          thinkingBubble.className = 'mo-help-chat-bubble assistant';
          history.push({ role: 'assistant', content: data.reply });
          scrollToBottom();
        })
        .catch(function (err) {
          thinkingBubble.textContent = err && err.message ? err.message : 'Something went wrong.';
          thinkingBubble.className = 'mo-help-chat-bubble error';
          // Don't keep a failed turn in history sent back to the model.
          history.pop();
        })
        .finally(function () {
          input.disabled = false;
          sendBtn.disabled = false;
          input.focus();
          scrollToBottom();
        });
    });

    input.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
  })();
</script>
